[project]
name = "voice-input"
version = "0.1.0"
description = "Russian and English voice input for Windows with local speech recognition (GigaAM-v3, Parakeet)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "pyside6-essentials>=6.12.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
voice-input = "voice_input:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
